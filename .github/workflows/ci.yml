name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 24
  # The single image all three services run. Lowercase because registry paths are case-sensitive and
  # GHCR rejects the repo owner's mixed-case spelling.
  IMAGE_NAME: ghcr.io/cry0nics/chaptify

# The default token is read-only; the publish and prune jobs widen it themselves.
#
# Actions in any job holding a scope beyond `contents: read` are pinned to a full commit SHA with the
# release in a trailing comment: a mutable tag like `@v7` is a pointer its owner can move, and those
# jobs hold a token that can write to the registry. Read-only jobs stay on tags, where a moved tag
# cannot reach anything worth having.
#
# The one exception is the Trivy action, pinned by SHA in the read-only `docker` job too. That gate has
# to be the SAME scanner and the same bundled Trivy version as the publishing gate, or a green PR
# would not actually predict a green publish. `uses:` takes no expressions, so the pin is repeated
# literally; the three copies (here twice, once in image-rescan.yml) must be bumped together.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so a new push doesn't queue behind stale jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format-check
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test

  build:
    name: Build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  docker:
    name: Docker Compose smoke
    runs-on: ubuntu-latest
    # Read-only. This job runs the same vulnerability gate as `publish` but holds no registry scope, so
    # a pull request gets the gate's verdict without any job in the run being able to publish.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The smoke script uses only Node built-ins, so no npm ci is needed on the host; the
      # Dockerfile builds and installs everything inside the image.
      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The smoke script shells out to ffmpeg on the host to generate the synthetic audiobook it
      # feeds into the container, so ffmpeg must be present even though npm ci is not needed.
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Create empty env file for compose validation
        run: |
          touch .env
          echo "NUXT_DOWNLOAD_SIGNING_SECRET=ci-download-signing-secret-with-32-chars" >> .env
      - name: Validate docker compose
        run: docker compose config
      # Both production overlays are validated here because neither is exercised by the smoke test
      # below. Asserting the RENDERED config, not just that it parses: the overlays drop inherited
      # list values with `!reset` / `!override`, and a Compose older than 2.24.4 ignores an unknown
      # tag instead of failing — which would silently keep the worker's host-gateway alias and the
      # API's published port in production.
      - name: Validate production overlays
        run: |
          set -euo pipefail
          prod=$(DOMAIN=example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config)
          # CHAPTIFY_TAG is required by the vps overlay, so rendering it also asserts that the `:?`
          # guard is wired up: an unset tag must be a hard interpolation error, never an empty tag.
          vps=$(CHAPTIFY_TAG=sha-0000000 docker compose -f docker-compose.yml -f docker-compose.vps.yml config)
          if CHAPTIFY_TAG= docker compose -f docker-compose.yml -f docker-compose.vps.yml config >/dev/null 2>&1; then
            echo "vps overlay renders without CHAPTIFY_TAG — the required-variable guard is gone"; exit 1
          fi
          echo "$prod" | grep -q 'host.docker.internal' && { echo "prod overlay still has the host-gateway alias"; exit 1; }
          echo "$vps" | grep -q 'host.docker.internal' && { echo "vps overlay still has the host-gateway alias"; exit 1; }
          echo "$vps" | grep -q 'published' && { echo "vps overlay still publishes a host port"; exit 1; }
          echo "$vps" | grep -q 'chaptify-proxy' || { echo "vps overlay lost the dedicated proxy network"; exit 1; }
          echo "$vps" | grep -q 'edge' && { echo "vps overlay must not put the API on the shared edge network"; exit 1; }
          # The box pulls a pinned registry tag and has no source tree, so a surviving `build:` would
          # turn a failed pull into a confusing build attempt, and a surviving local `chaptify:latest`
          # would mean it pulls nothing at all.
          test "$(echo "$vps" | grep -c "image: ${IMAGE_NAME}:sha-0000000")" = 3 \
            || { echo "vps overlay does not pin the pinned GHCR tag on all three services"; exit 1; }
          echo "$vps" | grep -qE '^\s+build:' && { echo "vps overlay still builds the image on the box"; exit 1; }
          echo "$vps" | grep -q 'image: chaptify:latest' && { echo "vps overlay still uses the local dev image"; exit 1; }
          echo "Rendered overlays match their intent."
      - name: Build Docker Compose stack
        run: docker compose build
      # The same gate `publish` applies, run here on every pull request against the image this job just
      # built from the same Dockerfile and context. A green PR therefore means the image is publishable
      # — the gate cannot first be discovered red after merge, when the only way forward is a follow-up
      # commit on main. Same action pin, same flags, same `.trivyignore`, deliberately duplicated rather
      # than shared, because `publish` must re-scan the exact bytes it pushes and this job's image is a
      # different build of the same source.
      - name: Vulnerability gate (Trivy, read-only preview of the publish gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: chaptify:latest
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Start Docker Compose stack
        run: docker compose up -d
      - name: Smoke Docker Compose stack
        run: npm run smoke:docker
      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down -v

  # Build the image once, gate it on a vulnerability scan, and only then push it to GHCR. The VPS
  # never builds and never clones this repo — it pulls a tag this job produced (see
  # docker-compose.vps.yml), so this job is the sole path from source to a runnable image.
  publish:
    name: Publish image
    # Only what has actually landed on main gets published. Pull requests still build and smoke the
    # image in the `docker` job above, they just produce no tag — so every tag in the registry
    # corresponds to a commit on main, which is what makes `sha-<shortsha>` a usable rollback target.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test, build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the built-in GITHUB_TOKEN push to ghcr.io. The repository that publishes a package is
      # automatically granted admin on it, which is also what the prune job below relies on.
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Recommended rather than required by the action, and cheap.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve image tag
        id: tag
        # On a push event `github.sha` is the commit that landed on main, so this names the tree that
        # was built — the one thing `latest` alone can never tell you.
        #
        # It names a COMMIT, not a set of bytes. GHCR has no immutable-tag setting, so re-running this
        # workflow for the same commit rebuilds against whatever `node:24-alpine3.24` and Alpine's apk
        # repo serve that day and overwrites the tag with different bytes. The push step below records
        # the digest it actually pushed so the mapping is recoverable from the run log; byte-exact
        # pinning is a digest, not this tag.
        run: echo "short-sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build image (local only, not pushed)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Into the runner's own daemon so the scanner can read it, and so the push below can move
          # those same bytes rather than rebuilding them. Single-platform only, which is fine: the box
          # is x86 and cross-building was rejected.
          load: true
          push: false
          tags: chaptify:scan
      # The gate. Scoped to CRITICAL/HIGH findings that already have a fix published, so every
      # failure here has an action attached: bump the base image, apk package, or npm dependency and
      # rebuild. A blanket "no highs" would eventually block on findings with no available remedy,
      # which teaches an operator to route around the gate. Unfixed findings are not ignored, just
      # not blocking — the weekly rescan workflow prints them in full.
      - name: Vulnerability gate (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: chaptify:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Reached only when the gate passed, so a vulnerable image is never published under any tag and
      # the box has no ungated image to pull.
      #
      # Retagging and pushing the image already in the daemon, rather than a second
      # build-push-action with `push: true`, is deliberate. The upstream test-before-push pattern
      # re-runs the build and relies on it being a cache hit; that is near-certain but not
      # guaranteed, and any cache miss would publish bytes the scanner never saw. Pushing the loaded
      # image makes "what was scanned is what was published" true by construction. It is only
      # available because the image is single-platform — a multi-platform build could not be loaded
      # into the daemon in the first place.
      - name: Push image
        env:
          SHA_TAG: ${{ env.IMAGE_NAME }}:sha-${{ steps.tag.outputs.short-sha }}
          LATEST_TAG: ${{ env.IMAGE_NAME }}:latest
        run: |
          set -euo pipefail
          docker tag chaptify:scan "$SHA_TAG"
          docker tag chaptify:scan "$LATEST_TAG"
          docker push "$SHA_TAG"
          # Same digest, so this only writes a second tag pointing at the manifest just uploaded.
          docker push "$LATEST_TAG"

          # Record what the tag resolved to. The tag is a name a re-run can reassign; the digest is the
          # content. Keeping it in the run log means a rollback can be made byte-exact, and that a box
          # can be checked against what CI actually published.
          #
          # Filtered by repository rather than `index .RepoDigests 0`: the image is tagged into more than
          # one repository here (`chaptify:scan` as well as GHCR), so RepoDigests holds several entries
          # and index 0 is whichever the daemon happens to list first. Verified against a local registry.
          # `|| true` because a non-matching grep would otherwise trip `pipefail` and kill the step before
          # the guard below could explain why.
          digest=$(docker image inspect "$SHA_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -m1 "^${IMAGE_NAME}@" | cut -d@ -f2 || true)
          if [ -z "$digest" ]; then
            echo "::error title=Could not read the pushed digest::${SHA_TAG} has no ${IMAGE_NAME}@sha256 entry after push"
            exit 1
          fi
          echo "Published $SHA_TAG (also tagged latest) at ${digest}."
          {
            echo "### Published image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`sha-${{ steps.tag.outputs.short-sha }}\` |"
            echo "| digest | \`${digest}\` |"
            echo
            echo "Deploy by setting this in the box's \`.env\`:"
            echo
            echo '```bash'
            echo "CHAPTIFY_TAG=sha-${{ steps.tag.outputs.short-sha }}"
            echo '```'
            echo
            echo "A reference may carry both, and the digest wins — use this form when the exact bytes"
            echo "matter more than readability (an audited rollback, or verifying a box):"
            echo
            echo '```bash'
            echo "CHAPTIFY_TAG=sha-${{ steps.tag.outputs.short-sha }}@${digest}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Every build rewrites the application layers, so versions would otherwise accumulate forever. A GHCR
  # package is private on first publish even from a public repository, and a private package's size
  # counts against the owner's storage quota — so pruning pays for itself immediately. It stays worth
  # having if the package is later made public and storage becomes free: the kept set is also the
  # rollback menu, and ten entries is a list a person can read.
  #
  # Deliberately NOT a step inside `publish`: a registry hiccup here must not report a successful push
  # as a failed one.
  prune-registry:
    name: Prune old GHCR versions
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Keeps the ten most recent versions. A GHCR version is a manifest digest, not a tag, and
      # `docker push` of a single-platform image writes exactly one manifest with no attestation
      # sidecars — so one build is one version carrying both its `sha-` tag and `latest`. Ten
      # versions is therefore ten builds of main, and `latest` always rides the newest of them and can
      # never be pruned out from under the registry. Ten is also the rollback window: `CHAPTIFY_TAG`
      # can be set back to any of these, no further.
      #
      # An empty delete list is a no-op success, so this is safe on the first builds too.
      - name: Delete all but the ten newest versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: chaptify
          package-type: container
          min-versions-to-keep: 10

  # The repository is public, so GitHub disables its scheduled workflows after 60 days with no
  # repository activity — and documents no notification when it does. The weekly image rescan is the
  # only thing watching the image that is already deployed, and a disabled workflow cannot report its
  # own absence, so the check runs here instead: every push and pull request asks the API what state the
  # rescan is in.
  #
  # BE HONEST ABOUT THE COVERAGE THIS BUYS. This is detection on the next activity, not continuous
  # monitoring. Its triggers are exactly the activity whose absence disables the schedule, so through
  # the quiet stretch that trips the 60-day timer nothing here runs and nothing warns. What it buys is
  # that the failure stops being permanent and silent — the next time anyone touches the repository the
  # run goes red and names the command that re-arms it. Any push also resets the 60-day clock, so
  # ordinary commits keep the schedule alive by themselves and the only uncovered state is a repository
  # untouched for two months. Continuous coverage would have to come from outside this repository (a
  # timer on the VPS, a schedule in a repository that stays active, or making this one private);
  # docs/deployment.md records those options and that none is implemented.
  rescan-freshness:
    name: Rescan workflow still armed
    runs-on: ubuntu-latest
    permissions:
      # Read-only, and the narrowest scope that can read workflow state and run history.
      actions: read
    steps:
      - name: Check the rescan workflow is enabled and running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW: image-rescan.yml
          # Warn once a scheduled weekly run has missed roughly two turns. Tight enough to notice a
          # silently stopped schedule, loose enough that one delayed or dropped cron run — which
          # GitHub explicitly allows under load — is not treated as breakage.
          STALE_AFTER_DAYS: 21
        run: |
          set -euo pipefail

          # The API answers for the repository, not for this ref, so it 404s while the workflow exists
          # only on a feature branch — including the pull request that first adds it. That is a
          # not-yet state, not a broken one, so it warns and passes rather than failing a PR for the
          # absence of something the PR itself is adding.
          if ! state=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}" --jq '.state' 2>/dev/null); then
            echo "::warning title=Rescan workflow not registered yet::${WORKFLOW} is not on the default branch yet; this check becomes meaningful once it is merged."
            exit 0
          fi
          echo "State: ${state}"

          if [ "$state" != "active" ]; then
            {
              echo "### Weekly image rescan is NOT running"
              echo
              echo "\`${WORKFLOW}\` is in state \`${state}\`, so the deployed image is no longer being"
              echo "rescanned for new advisories. A public repository has its scheduled workflows"
              echo "disabled after 60 days without repository activity."
              echo
              echo "Re-enable it with:"
              echo
              echo '```'
              echo "gh workflow enable ${WORKFLOW}"
              echo '```'
              echo
              echo "Then run it once to confirm: \`gh workflow run ${WORKFLOW}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Weekly image rescan disabled::${WORKFLOW} is ${state}. Re-enable with: gh workflow enable ${WORKFLOW}"
            exit 1
          fi

          # Active is not the same as actually running — a schedule can also be silently starved.
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${WORKFLOW}/runs?per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')
          if [ -z "$last" ]; then
            echo "::warning title=Weekly image rescan has never run::Trigger one with: gh workflow run ${WORKFLOW}"
            echo "Rescan workflow is active but has no runs yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last run: ${last} (${age_days} days ago)"
          if [ "$age_days" -gt "$STALE_AFTER_DAYS" ]; then
            echo "::warning title=Weekly image rescan looks stale::Last run was ${age_days} days ago (${last}). Check the schedule, or run: gh workflow run ${WORKFLOW}"
            echo "Rescan workflow is active but last ran ${age_days} days ago (${last})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Rescan workflow is armed; last run ${age_days} days ago."
          fi

  # Single stable check to point branch protection at: green only when every job above passed.
  # `prune-registry` and `rescan-freshness` are left out deliberately — housekeeping and monitoring must
  # not gate a merge, least of all an urgent security fix. Both still turn the run red and email on
  # failure, because any failed job fails the run.
  ci-complete:
    name: CI complete
    if: always()
    needs: [lint, typecheck, test, build, docker, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
