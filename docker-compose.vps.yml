# Shared-VPS overlay for Chaptify — for a box that also runs other services behind ONE central
# Caddy (see the vps deployment plan). NOT auto-loaded; opt in explicitly:
#
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.vps.yml in .env on that box.
#
# Use this INSTEAD of docker-compose.prod.yml, never both: that overlay ships Chaptify's own Caddy
# and publishes 80/443, which would collide with the central proxy. Here Chaptify publishes no host
# port at all and is reachable only as `chaptify:3000` on a network shared with nothing but the
# proxy.
#
# Requires Compose 2.24.4+ (for the `!reset` and `!override` tags — older versions ignore an unknown
# tag instead of failing, which would silently keep the values this file means to drop), and the
# network to exist first:
#
#   docker network create chaptify-proxy
services:
    chaptify:
        # A DEDICATED two-member network (this API + the central Caddy), deliberately NOT the shared
        # `edge` network the other services use.
        #
        # This is what makes NUXT_TRUST_PROXY=true safe. That setting trusts the right-most
        # X-Forwarded-For hop from whoever connects, which is only sound while the sole thing that
        # can connect is a proxy that overwrites the header. On a shared network every other
        # container — including a headless browser that fetches untrusted web content — can reach
        # this port directly and forge the header, letting a compromised neighbour rotate through
        # fake client identities to evade per-IP limits, or burn a chosen victim IP's budget.
        # Removing the host port is not sufficient on its own; container-to-container traffic on a
        # shared bridge is unrestricted.
        networks:
            - chaptify-proxy
        # No published host port: the central Caddy reaches the API over `chaptify-proxy`. `!reset`
        # is required because list fields in an override are appended, not replaced — `ports: []`
        # would leave the inherited loopback binding in place.
        ports: !reset []
        volumes: !override
            # Dedicated host path rather than a named volume, so Chaptify's transient audio is
            # isolated, attributable, and movable onto a separate disk later without touching any
            # other service's data. Create it BEFORE the first `up` and give it to the image's
            # appuser — `install -d -o 100 -g 101 -m 750 /srv/chaptify-data`. Docker would otherwise
            # create the missing path as root:root and every write would fail with EACCES.
            - /srv/chaptify-data:/data/chaptify
        cpus: "1.0"
        mem_limit: 512m

    worker:
        # The FFmpeg process handles fully untrusted uploaded media, so it joins neither the proxy
        # network nor the shared `edge` one. It keeps the stack's own default bridge because it still
        # needs plain egress to the Mailgun API to send completion mail — it accepts no inbound
        # connections, and it cannot reach the API's port either.
        extra_hosts: !reset []
        volumes: !override
            - /srv/chaptify-data:/data/chaptify
        # Hard resource ceiling independent of NUXT_WORKER_CONCURRENCY: application-level
        # concurrency assumes well-behaved input, while these caps hold even if a crafted file makes
        # FFmpeg spin or allocate. Sized for a 4 vCPU / 8 GB box so one long transcode cannot starve
        # the other services sharing it. `memswap_limit` equal to `mem_limit` denies this container
        # swap entirely: audio transcoding needs a small fraction of 1.5 GB, so hitting the limit
        # means something is wrong and should be OOM-killed rather than left thrashing the host's
        # 2 GB swapfile, which every other service shares.
        cpus: "2.0"
        mem_limit: 1536m
        memswap_limit: 1536m

    cleanup:
        # Inherits `network_mode: none` from the base file — it has no network stack at all.
        volumes: !override
            - /srv/chaptify-data:/data/chaptify
        cpus: "0.5"
        mem_limit: 256m

networks:
    # Created out of band so its membership is an explicit operator decision: only the central Caddy
    # and this API belong on it. `docker network create chaptify-proxy`
    chaptify-proxy:
        external: true
